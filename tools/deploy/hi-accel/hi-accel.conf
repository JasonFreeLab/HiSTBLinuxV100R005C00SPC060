# /etc/hi-accel.conf —— Hi3798MV300 硬件加速开机加载配置（DEP-01）
# 改完无需重装：systemctl restart hi-accel（已加载的模块会跳过）

# 模块与工具所在目录（板上）
HI_DIR=/root/m2

# 各模块开关：1=开机加载，0=不加载（便于分段测试）
HI_LOAD_VDEC=1
HI_LOAD_VENC=1
HI_LOAD_JPEG=1
HI_LOAD_PNG=1
HI_LOAD_TDE=1
# PNG 模块：hi_png_reload.ko = v15（TDE CLUT 接线；TDE 缺失时 dummy 兜底，非 CLUT 路径不受影响）
HI_PNG_KO=hi_png_reload.ko
# TDE 模块：hi_tde.ko = 完整 TDE 2D 驱动（/dev/hi_tde、CLUT 颜色扩展；无 DT 节点时轮询完成兜底）
HI_TDE_KO=hi_tde.ko

# VDEC 参数（当前验收对 reloadfix e8859791 的固定配方）
# vdec_hdr_meta=0：VDEC-02B 修复。=1 时每帧分配 HDR 元数据 buffer，但释放分支在未定义的
#   HI_HDR_DOLBYVISION_SUPPORT 内 → 每次解码泄漏约 48 KB MMZ（OPS-02 实测 3 boot 一致）。无 VO/HDR 消费者，关闭无功能损失。
HI_VDEC_PARAMS="m2_sync_downmsg=1 m2_sync_msgs=1 m2_sync_scd=1 m2_sync_hevc_msgs=1 vdec_dfs=1 vdec_sed_only=0 vdec_hdr_meta=0"

# 开机预热：1=加载后跑一次 1080p HEVC 解码（VDEC-05：cold 吞吐仅 0.24×steady）
HI_WARMUP=1

# sha1 校验失败时：1=拒绝加载该模块（推荐），0=只告警
HI_STRICT_SHA1=1
